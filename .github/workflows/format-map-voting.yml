name: Format map voting branch

on:
  push:
    branches:
      - feature/19-map-voting

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/19-map-voting
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AnoCore.sln
      - name: Format
        run: dotnet format AnoCore.sln --no-restore
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply dotnet formatting to map voting"
          git push origin HEAD:feature/19-map-voting
