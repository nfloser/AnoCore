name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANOCORE_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User ID=anocore;Password=anocore;Database=anocore;Pooling=true;Connection Timeout=10;Default Command Timeout=30"

    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_DATABASE: anocore
          MARIADB_USER: anocore
          MARIADB_PASSWORD: anocore
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uanocore -panocore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AnoCore.sln

      - name: Build
        run: dotnet build AnoCore.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AnoCore.sln --configuration Release --no-build --verbosity normal

      - name: Install preview preparation dependency
        run: python3 -m pip install -r tools/veto-preview-requirements.txt

      - name: Test offline operator tools
        run: python3 -m unittest discover -s tests/operator -p 'test_*.py'

      - name: Validate UI build script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/ui/AnoCore/build.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Verify formatting
        run: dotnet format AnoCore.sln --verify-no-changes --no-restore

      - name: Pack module SDK
        run: dotnet pack src/AnoCore.Abstractions/AnoCore.Abstractions.csproj --configuration Release --no-build --output artifacts/sdk

      - name: Inspect module SDK package
        shell: bash
        run: |
          set -euo pipefail
          package="$(find artifacts/sdk -maxdepth 1 -type f -name 'AnoCore.Abstractions.*.nupkg' -print -quit)"
          test -n "$package"

          unzip -Z1 "$package" > artifacts/sdk/package-contents.txt
          for required in             'lib/net10.0/AnoCore.Abstractions.dll'             'lib/net10.0/AnoCore.Abstractions.xml'             'LICENSE.md'             'NOTICE.md'             'README.md'; do
            grep -Fxq "$required" artifacts/sdk/package-contents.txt || {
              echo "SDK package is missing $required" >&2
              exit 1
            }
          done

          nuspec="$(grep -E '\.nuspec$' artifacts/sdk/package-contents.txt | head -n 1)"
          test -n "$nuspec"
          unzip -p "$package" "$nuspec" > artifacts/sdk/AnoCore.Abstractions.nuspec

          if grep -Eiq 'AnoCore\.Runtime|AnoCore\.Plugin|CounterStrikeSharp|MySqlConnector' artifacts/sdk/AnoCore.Abstractions.nuspec; then
            echo 'SDK package leaked a runtime, engine or persistence dependency.' >&2
            exit 1
          fi

          if grep -Eiq '<dependency[[:space:]]' artifacts/sdk/AnoCore.Abstractions.nuspec; then
            echo 'AnoCore.Abstractions must remain dependency-free.' >&2
            exit 1
          fi

      - name: Validate Panorama source assets
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          layout = pathlib.Path("ui/AnoCore/layout/custom_game/anocore/ano_veto.xml")
          style = pathlib.Path("ui/AnoCore/styles/custom_game/anocore/ano_veto.css")
          build = pathlib.Path("ui/AnoCore/build.ps1")

          for path in (layout, style, build):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing Panorama source asset: {path}")

          for hud_layout in (layout, pathlib.Path("ui/AnoCore/layout/custom_game/anocore/menu.xml")):
              document = ET.parse(hud_layout).getroot()
              panels = [element for element in document if element.tag == "Panel"]
              if len(panels) != 1 or "id" in panels[0].attrib:
                  raise SystemExit(f"Panorama requires one anonymous outermost Panel: {hud_layout}")

          allowed = {"root": set(), "styles": set(), "include": {"src"},
                     "Panel": {"id", "class", "hittest"}, "Button": {"id", "class"},
                     "Label": {"id", "class", "text"}}
          for source in (layout, pathlib.Path("ui/AnoCore/layout/custom_game/anocore/menu.xml")):
              for element in ET.parse(source).getroot().iter():
                  if element.tag not in allowed or set(element.attrib) - allowed[element.tag]:
                      raise SystemExit(f"Unsupported native Panorama element/attributes: {source}: {element.tag} {element.attrib}")

          root = ET.parse(layout).getroot()
          ids = {element.attrib["id"] for element in root.iter() if "id" in element.attrib}
          required = {"ano_veto_root", "ano_veto_close", "ano_veto_title", "ano_veto_status"}
          required.update({f"ano_veto_map_{index}" for index in range(8)})
          required.update({f"ano_veto_map_{index}_text" for index in range(8)})
          missing = sorted(required - ids)
          if missing:
              raise SystemExit(f"AnoVeto Panorama layout missing ids: {missing}")

          text = layout.read_text(encoding="utf-8")
          if "ano_veto.vcss_c" not in text:
              raise SystemExit("AnoVeto layout does not reference its compiled stylesheet")
          if "ano_veto_previews.vcss_c" not in text or not (style.parent / "ano_veto_previews.css").is_file():
              raise SystemExit("AnoVeto layout lacks its static preview stylesheet")
          if {f"ano_veto_map_{index}_image" for index in range(8)} - set(ids):
              raise SystemExit("AnoVeto layout lacks image panels")
          if ".ano-overlay.shown" not in style.read_text(encoding="utf-8"):
              raise SystemExit("AnoVeto stylesheet does not define visible HUD state")
          build_text = build.read_text(encoding="utf-8")
          if "InstallLocalClient" not in build_text:
              raise SystemExit("AnoCore HUD build script must retain the local-client smoke-test installation option")
          menu = pathlib.Path("ui/AnoCore/layout/custom_game/anocore/menu.xml")
          menu_style = pathlib.Path("ui/AnoCore/styles/custom_game/anocore/menu.css")
          menu_root = ET.parse(menu).getroot()
          menu_ids = [element.attrib["id"] for element in menu_root.iter() if "id" in element.attrib]
          if len(menu_ids) != len(set(menu_ids)):
              raise SystemExit("Duplicate menu panel IDs")
          menu_required = {"ano_menu_root", "ano_menu_title", "ano_menu_status", "ano_menu_page", "ano_menu_home", "ano_menu_back", "ano_menu_close", "ano_menu_previous", "ano_menu_next"}
          menu_required.update({"ano_dashboard_" + name for name in
                                ("profile", "progression", "statistics", "playtime", "challenge_0", "challenge_1")})
          for resource in ("anomeme_banner.png", "anomeme_banner.vtex"):
              if not (menu_style.parent / resource).is_file():
                  raise SystemExit(f"Missing ANOMEME artwork: {resource}")
          menu_required.update({f"ano_menu_row_{index}" for index in range(6)})
          menu_required.update({f"ano_menu_row_{index}_text" for index in range(6)})
          if menu_required - set(menu_ids):
              raise SystemExit("Shared Panorama menu is missing server-facing panels")
          if "menu.vcss_c" not in menu.read_text() or ".ano-menu-overlay.shown" not in menu_style.read_text():
              raise SystemExit("Shared Panorama menu lacks styles/visibility contract")
          PY

      - name: Publish development plugin
        run: dotnet publish src/AnoCore.Plugin/AnoCore.Plugin.csproj --configuration Release --no-build --output artifacts/plugins/AnoCore

      - name: Publish management sidecar
        run: dotnet publish src/AnoCore.Management.Host/AnoCore.Management.Host.csproj --configuration Release --no-build --output artifacts/management/AnoCore.Management.Host

      - name: Validate management sidecar
        shell: bash
        run: |
          test -s artifacts/management/AnoCore.Management.Host/AnoCore.Management.Host.dll
          test -s artifacts/management/AnoCore.Management.Host/AnoCore.Runtime.dll
          if find artifacts/management/AnoCore.Management.Host -iname 'CounterStrikeSharp.API.dll' -print -quit | grep -q .; then
            echo 'Management sidecar must not depend on CounterStrikeSharp.' >&2
            exit 1
          fi

      - name: Validate deployment package
        run: |
          test -s artifacts/plugins/AnoCore/AnoCore.dll
          test -s artifacts/plugins/AnoCore/AnoCore.Runtime.dll
          test -s artifacts/plugins/AnoCore/AnoCore.Abstractions.dll
          test -s artifacts/plugins/AnoCore/AnoCore.Modules.Admin.dll
          test -s artifacts/plugins/AnoCore/AnoCore.Modules.Stats.dll
          test -s artifacts/plugins/AnoCore/AnoCore.Modules.Progression.dll
          test -s artifacts/plugins/AnoCore/AnoCore.Modules.Progression.Persistence.dll
          test -s artifacts/plugins/AnoCore/AnoCore.Modules.AnoVeto.dll
          test -s artifacts/plugins/AnoCore/AnoCore.Modules.Tournament.dll
          test -s artifacts/plugins/AnoCore/AnoCore.Modules.Tournament.Persistence.dll
          test -s artifacts/plugins/AnoCore/MySqlConnector.dll
          test -s artifacts/plugins/AnoCore/AnoCore.deps.json
          if find artifacts/plugins/AnoCore -iname 'CounterStrikeSharp.API.dll' -print -quit | grep -q .; then
            echo 'CounterStrikeSharp.API.dll must be supplied by the server, not the plugin package.' >&2
            exit 1
          fi
          cp LICENSE.md NOTICE.md artifacts/
          cp docs/deployment.md artifacts/INSTALL.md
          cp docs/player-dashboard.md artifacts/DASHBOARD.md
          cp -R docs artifacts/docs
          mkdir -p artifacts/examples artifacts/tools
          cp -R examples/server-profiles artifacts/examples/server-profiles
          cp tools/prepare_anomeme_profile.py artifacts/tools/prepare_anomeme_profile.py
          cp tools/prepare_veto_previews.py tools/veto-preview-requirements.txt artifacts/tools/
          cp docs/quick-install.md artifacts/QUICK-INSTALL.md
          cp docs/steam-addon.md artifacts/STEAM-ADDON.md
          mkdir -p artifacts/ui
          cp -R ui/AnoCore artifacts/ui/AnoCore
          git rev-parse HEAD > artifacts/BUILD-COMMIT.txt
          git archive --format=zip --output=artifacts/AnoCore-source.zip HEAD

      - name: Upload development package
        uses: actions/upload-artifact@v4
        with:
          name: AnoCore-development
          path: artifacts/
          if-no-files-found: error
